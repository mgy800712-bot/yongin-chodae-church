<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이번 주 말씀 영상 · 용인초대교회</title>
<meta name="description" content="교회 유튜브 쇼츠를 지인에게 한 편 보내 보세요">
<meta name="color-scheme" content="light">
<!-- 카카오톡 공유 미리보기 -->
<link rel="canonical" href="https://mgy800712-bot.github.io/yongin-chodae-church/card.html">
<meta property="og:url" content="https://mgy800712-bot.github.io/yongin-chodae-church/card.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="대한예수교장로회 용인초대교회">
<meta property="og:title" content="이번 주 말씀 영상, 한 편 보내세요">
<meta property="og:description" content="1분이면 봅니다 · 용인초대교회">
<meta property="og:image" content="https://mgy800712-bot.github.io/yongin-chodae-church/assets/img/og-card.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="이번 주 말씀 영상 — 1분이면 봅니다">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/invite.css">
</head>
<body>

<div class="wrap">
<section class="sheet">

  <p class="brand">용인초대교회</p>
  <h1 class="hello">이번 주 말씀 영상
    <small>마음에 떠오르는 분께 한 편 보내 보세요</small>
  </h1>

  <!-- 말씀 한 줄 — data/this-week.js 에 적어 두면 영상 위에 함께 나옵니다 -->
  <div class="card2" id="wordBox" hidden>
    <span class="lb">이번 주 말씀</span>
    <p class="ref" id="wordRef" hidden></p>
    <p id="wordLine"></p>
  </div>

  <!-- 교회 유튜브의 쇼츠만 모인 목록 — 새로 올리면 저절로 맨 앞에 들어옵니다 -->
  <div class="vid tall" id="vidBox">
    <button type="button" id="vidPlay" class="plain" aria-label="말씀 영상 보기">
      <span class="pl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l12 7-12 7z"/></svg></span>
      <span class="pt">가장 최근 말씀 영상</span>
    </button>
  </div>
  <p class="note" style="margin-top:12px;font-size:15px">영상 안에서 옆으로 넘기면 지난 영상도 볼 수 있어요.</p>

  <div class="cta" style="margin-top:22px">
    <button type="button" id="send">카톡으로 보내기<b style="display:block;font-size:15px;font-weight:400;margin-top:3px;color:#6a5b47">받으신 분도 바로 볼 수 있어요</b></button>
  </div>

  <p class="note" id="say" hidden style="font-weight:700;color:#7a5a2c"></p>

  <div class="msgs">
    <h3>이렇게 보내 보세요</h3>
    <button type="button" class="msg" data-m="이번 주에 들은 말씀인데, 문득 생각나서 보내요. 1분이면 봐요.">
      <span>이번 주에 들은 말씀인데, 문득 생각나서 보내요. 1분이면 봐요.</span>
    </button>
    <button type="button" class="msg" data-m="요즘 어떻게 지내요? 짧은 영상 하나 보내요.">
      <span>요즘 어떻게 지내요? 짧은 영상 하나 보내요.</span>
    </button>
    <button type="button" class="msg" data-m="오늘 하루도 평안하시길 바라며 보냅니다.">
      <span>오늘 하루도 평안하시길 바라며 보냅니다.</span>
    </button>
  </div>

  <a class="back" href="index.html">교회 이야기 둘러보기</a>
</section>
</div>

<footer>
  <div class="motto">주를 기뻐하게, 주로 기뻐하라</div>
  <p>
    대한예수교장로회 용인초대교회<br>
    경기도 용인시 처인구 이동읍 경기동로 679 3층<br>
    담임목사 이현무
  </p>
</footer>

<script src="data/this-week.js"></script>
<script>
/* this-week.js 가 깨져도 영상과 보내기는 그대로 돌아간다 */
(function () {
  // 유튜브가 채널마다 자동으로 관리하는 '쇼츠만 모인 재생목록' (채널ID 의 UC 를 UUSH 로)
  var CHANNEL_SHORTS = 'UUSHRYw9Ca3ssSym_KycnLJRMw';
  var PAGE = location.href.split(/[?#]/)[0];
  var BASE = PAGE.replace(/[^/]*$/, '');

  var w = window.THIS_WEEK || {};
  function v(s) { s = (s || '').trim(); return s.charAt(0) === '[' ? '' : s; }

  // 말씀 한 줄 — 적어 두었을 때만 나온다
  var line = v(w.cardVerse) || v(w.summary), ref = v(w.verse);
  if (line) {
    document.getElementById('wordLine').textContent = line;
    if (ref) {
      var r = document.getElementById('wordRef');
      r.textContent = ref; r.hidden = false;
    }
    document.getElementById('wordBox').hidden = false;
  }

  // 영상 — 누르기 전에는 불러오지 않는다
  var box = document.getElementById('vidBox');
  document.getElementById('vidPlay').onclick = function () {
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/videoseries?list=' + CHANNEL_SHORTS + '&autoplay=1&rel=0';
    f.title = '용인초대교회 말씀 영상';
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    f.allowFullscreen = true;
    box.replaceChildren(f);
  };

  function say(m) { var el = document.getElementById('say'); el.textContent = m; el.hidden = false; }
  async function copyTxt(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
    try {
      var t = document.createElement('textarea');
      t.value = text; t.setAttribute('readonly', '');
      t.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(t); t.select(); t.setSelectionRange(0, t.value.length);
      var ok = document.execCommand('copy'); t.remove(); return ok;
    } catch (_) { return false; }
  }

  // 카카오톡 공유 — 안 되면 휴대폰 공유창, 그것도 안 되면 주소 복사
  var KAKAO_KEY = '3b69adad3846c8371c0781e723a9e45a';   // '용인초대교회 웹' 키
  var kakaoOn = false;
  if (KAKAO_KEY) {
    var ks = document.createElement('script');
    ks.src = 'https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js';
    ks.crossOrigin = 'anonymous';
    ks.onload = function () {
      try { if (!Kakao.isInitialized()) Kakao.init(KAKAO_KEY); kakaoOn = true; } catch (_) {}
    };
    document.head.appendChild(ks);
  }

  document.getElementById('send').onclick = async function () {
    if (kakaoOn) {
      try {
        Kakao.Share.sendDefault({
          objectType: 'feed',
          content: {
            title: '이번 주 말씀 영상',
            description: (line ? line.slice(0, 60) : '1분이면 봅니다') + ' · 용인초대교회',
            imageUrl: BASE + 'assets/img/og-card.jpg',
            link: { mobileWebUrl: PAGE, webUrl: PAGE }
          },
          buttons: [{ title: '영상 보기', link: { mobileWebUrl: PAGE, webUrl: PAGE } }]
        });
        return;
      } catch (_) { /* 아래로 내려간다 */ }
    }
    try {
      if (navigator.share) {
        await navigator.share({ title: '이번 주 말씀 영상 · 용인초대교회', url: PAGE });
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;   // 공유창을 닫았을 뿐이다
    }
    say(await copyTxt(PAGE) ? '주소가 복사되었습니다. 카톡에 붙여 넣어 주세요.'
                            : '주소를 손가락으로 길게 눌러 복사해 주세요.');
  };

  // 함께 보낼 문구 — 눌러서 복사
  document.querySelectorAll('.msg').forEach(function (btn) {
    btn.onclick = async function () {
      say(await copyTxt(btn.dataset.m) ? '문구가 복사되었습니다.'
                                       : '아래 문구를 손가락으로 길게 눌러 복사해 주세요.');
    };
  });
})();
</script>
</body>
</html>
