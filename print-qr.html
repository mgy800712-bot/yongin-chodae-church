<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인쇄용 QR · 첫 방문 환영 페이지</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
  @page{size:A5;margin:0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e8e3d8;font-family:'Noto Sans KR',system-ui,sans-serif;color:#2a251f;
    word-break:keep-all;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tip{max-width:560px;margin:24px auto;padding:16px 18px;border-radius:8px;background:#fffdf7;
    border:1px solid #c49a52;font-size:15px;line-height:1.8}
  .tip b{font-family:'Noto Serif KR',serif}

  /* A5 한 장 — 교회 입구에 붙입니다 */
  .a5{width:min(148mm,100%);margin:0 auto 24px;padding:18mm 14mm;background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    border:1px solid #d6cdb9}
  .a5 h1{font-family:'Noto Serif KR',serif;font-size:30pt;font-weight:700;line-height:1.45}
  .a5 .sub{margin-top:6mm;font-size:13pt;line-height:1.7;color:#574e44}
  .a5 img{width:86mm;height:86mm;margin:10mm 0 8mm}
  .a5 .how{font-size:14pt;font-weight:700;color:#8d6a3a}
  .a5 .foot{margin-top:9mm;font-family:'Noto Serif KR',serif;font-size:11pt;color:#6a5b47;line-height:1.7}

  /* 주보용 작은 조각 — 오려서 주보에 붙이거나 그대로 편집기에 넣으세요 */
  .slip{width:min(148mm,100%);margin:0 auto 24px;padding:8mm;background:#fff;border:1px solid #d6cdb9}
  .slip .box{display:flex;align-items:center;gap:6mm;padding:5mm 6mm;border:1pt dashed #9a7430;border-radius:3mm}
  .slip img{width:26mm;height:26mm;flex:none}
  .slip .t{text-align:left}
  .slip .t b{display:block;font-family:'Noto Serif KR',serif;font-size:12pt;line-height:1.5}
  .slip .t span{display:block;margin-top:2mm;font-size:9.5pt;line-height:1.6;color:#574e44}

  @media print{
    body{background:#fff}
    .tip{display:none}
    .a5{width:148mm;height:210mm}
    .a5,.slip{margin:0;border:0;page-break-after:always}
    .slip{page-break-after:auto}
  }
</style>
</head>
<body>

<p class="tip"><b>인쇄하는 방법</b><br>
휴대폰·컴퓨터에서 이 페이지를 열고 인쇄를 누르세요. 용지는 A5, 여백은 '없음'으로 맞추면 됩니다.
첫 장은 입구에 붙이는 안내문, 둘째 장은 주보에 넣는 작은 조각입니다. 이 회색 설명은 인쇄되지 않습니다.</p>

<!-- 입구용 A5 -->
<section class="a5">
  <h1>처음 오셨나요?<br>환영합니다</h1>
  <p class="sub">오늘 예배와 다음 주 안내를<br>휴대폰으로 보실 수 있어요</p>
  <img src="assets/img/visit-qr.png" alt="첫 방문 환영 페이지 QR코드">
  <p class="how">휴대폰 카메라로 찍어 주세요</p>
  <p class="foot">용인초대교회<br>주일 낮 예배 오전 11시</p>
</section>

<!-- 주보용 작은 조각 -->
<section class="slip">
  <div class="box">
    <img src="assets/img/visit-qr.png" alt="첫 방문 환영 페이지 QR코드">
    <div class="t">
      <b>처음 오셨나요? 환영합니다</b>
      <span>휴대폰 카메라로 찍으면 오늘 말씀과<br>다음 주 안내를 보실 수 있어요.</span>
    </div>
  </div>
</section>

</body>
</html>
